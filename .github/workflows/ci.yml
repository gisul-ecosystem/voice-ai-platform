name: Dev CI/CD

on:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: dev-staging-deployment
  cancel-in-progress: false

env:
  IMAGE_REGISTRY: ghcr.io/gisul-ecosystem

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/backend-api/requirements*.txt
            services/voice-agent/requirements*.txt
      - name: Test backend API
        run: |
          python -m venv .venv-backend
          .venv-backend/bin/pip install -r services/backend-api/requirements.txt -r services/backend-api/requirements-dev.txt
          cd services/backend-api
          ../../.venv-backend/bin/python -m pytest -q
      - name: Test voice agent
        run: |
          python -m venv .venv-agent
          .venv-agent/bin/pip install -r services/voice-agent/requirements.txt -r services/voice-agent/requirements-dev.txt
          cd services/voice-agent
          ../../.venv-agent/bin/python -m pytest -q
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Verify frontend
        run: |
          npm ci
          npm run frontend:check

  images:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/backend-api/Dockerfile
          push: true
          tags: ${{ env.IMAGE_REGISTRY }}/backend-api:${{ github.sha }}
          cache-from: type=gha,scope=backend-api
          cache-to: type=gha,mode=max,scope=backend-api
      - name: Build voice-agent image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/voice-agent/Dockerfile
          push: true
          tags: ${{ env.IMAGE_REGISTRY }}/voice-agent:${{ github.sha }}
          cache-from: type=gha,scope=voice-agent
          cache-to: type=gha,mode=max,scope=voice-agent
      - name: Build context-engine image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/context-engine/Dockerfile
          push: true
          tags: ${{ env.IMAGE_REGISTRY }}/context-engine:${{ github.sha }}
          cache-from: type=gha,scope=context-engine
          cache-to: type=gha,mode=max,scope=context-engine
      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/voice-frontend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_REGISTRY }}/voice-frontend:${{ github.sha }}
          cache-from: type=gha,scope=voice-frontend
          cache-to: type=gha,mode=max,scope=voice-frontend

  deploy-staging:
    needs: images
    runs-on: [self-hosted, linux, x64, voice-ai-staging]
    permissions:
      contents: read
      packages: read
    environment:
      name: staging
      url: https://interviewer-dev.gisul.ai
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install deployment manifest
        run: |
          install -d -m 750 "$HOME/voice-ai-platform"
          install -m 640 deploy/compose.staging.yml "$HOME/voice-ai-platform/compose.staging.yml"
          install -m 640 deploy/Caddyfile "$HOME/voice-ai-platform/Caddyfile"
          install -m 750 deploy/deploy.sh "$HOME/voice-ai-platform/deploy.sh"
      - name: Deploy immutable images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          "$HOME/voice-ai-platform/deploy.sh" "${IMAGE_REGISTRY}" "${GITHUB_SHA}"
