name: CI

on:
  pull_request:
  push:
    branches: [dev, interviewer]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REGISTRY: ghcr.io/gisul-ecosystem

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [services/backend-api, services/voice-agent]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run frontend:check

  images:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/dev'
    needs: [python, frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend-api
            dockerfile: services/backend-api/Dockerfile
          - image: voice-agent
            dockerfile: services/voice-agent/Dockerfile
          - image: context-engine
            dockerfile: services/context-engine/Dockerfile
          - image: voice-frontend
            dockerfile: apps/voice-frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE_REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: images
    runs-on: [self-hosted, linux, x64, voice-ai-staging]
    environment:
      name: staging
      url: https://10.110.50.10
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install deployment manifest
        run: |
          install -d -m 750 "$HOME/voice-ai-platform"
          install -m 640 deploy/compose.staging.yml "$HOME/voice-ai-platform/compose.staging.yml"
          install -m 640 deploy/Caddyfile "$HOME/voice-ai-platform/Caddyfile"
          install -m 750 deploy/deploy.sh "$HOME/voice-ai-platform/deploy.sh"
      - name: Deploy immutable images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          "$HOME/voice-ai-platform/deploy.sh" "${IMAGE_REGISTRY}" "${GITHUB_SHA}"
